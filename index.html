<style>
/* Layout: one quiet column — wordmark, a single whispered line, two collections as soft grids, a side cart drawer. */
:root{
  --bg:#ecebee;          /* fog */
  --bg-2:#e3e2e7;        /* deeper fog for placeholders */
  --ink:#3b3a40;         /* faded ink */
  --ink-soft:#8a8891;    /* mist text */
  --line:#cfcdd4;        /* hairline */
  --accent:#8e86a3;      /* dusk lilac */
  --surface:#f5f4f6;
  --shade:rgba(40,38,48,.28);
  --f-display:"Shippori Mincho","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161b;--bg-2:#201f26;--ink:#d9d7de;--ink-soft:#85838d;--line:#33313b;--accent:#a79fbd;--surface:#1d1c22;--shade:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161b;--bg-2:#201f26;--ink:#d9d7de;--ink-soft:#85838d;--line:#33313b;--accent:#a79fbd;--surface:#1d1c22;--shade:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:14px;line-height:1.7;letter-spacing:.02em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:2}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.mark{font-family:var(--f-display);font-size:22px;letter-spacing:.35em;text-decoration:none;font-weight:400}
nav{display:flex;gap:22px;font-size:12px;color:var(--ink-soft);letter-spacing:.12em}
nav a{text-decoration:none}nav a:hover{color:var(--ink)}
.cart-btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
@media (max-width:640px){nav{display:none}}

/* hero */
.hero{padding-block:72px 56px;display:grid;gap:18px;justify-items:start}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,46px);line-height:1.35;margin:0;letter-spacing:.08em;text-wrap:balance;opacity:0;animation:fade 2.4s .2s ease forwards}
.hero h1 span{color:var(--ink-soft)}
.hero p{margin:0;color:var(--ink-soft);max-width:34em;font-size:13px}
.hero .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);letter-spacing:.14em}
@keyframes fade{from{opacity:.15;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none;opacity:1}}

/* collections */
.col{padding-block:40px 24px;border-top:1px solid var(--line)}
.col-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;margin-bottom:28px}
.col-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.14em}
.col-head h2 small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);letter-spacing:.2em;margin-top:2px}
.col-head p{margin:0;color:var(--ink-soft);font-size:12px;max-width:30em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}}

.card{text-align:left;display:grid;gap:10px;min-width:0}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--bg-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.6s ease,filter 1.6s ease;filter:saturate(.85)}
.card:hover .ph img,.card:hover .ph .art{transform:scale(1.03);filter:saturate(1)}
.art{position:absolute;inset:0;transition:transform 1.6s ease}
.art i{position:absolute;bottom:10px;left:10px;font-family:var(--f-mono);font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--ink-soft)}
.badge{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.18em;padding:2px 8px;background:var(--surface);color:var(--ink-soft)}
.info{display:grid;gap:2px;min-width:0}
.code{font-family:var(--f-mono);font-size:10px;color:var(--ink-soft);letter-spacing:.18em}
.name{font-size:13px;font-weight:400}
.name-en{font-size:11px;color:var(--ink-soft)}
.price{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;margin-top:4px}
.sold .ph{opacity:.55}

/* about / footer */
.about{border-top:1px solid var(--line);padding-block:56px;display:grid;grid-template-columns:1fr 2fr;gap:24px}
.about h2{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.14em;margin:0}
.about p{margin:0 0 12px;color:var(--ink-soft);max-width:38em}
@media (max-width:640px){.about{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:28px 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
footer .pays{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--f-mono)}

/* overlay panels */
.veil{position:fixed;inset:0;background:var(--shade);z-index:20;opacity:0;pointer-events:none;transition:opacity .5s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .5s ease;display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px}
.drawer.on{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid var(--line)}
.d-head h3{margin:0;font-family:var(--f-display);font-weight:400;letter-spacing:.2em;font-size:16px}
.d-body{flex:1;overflow:auto;padding-block:14px;min-height:0}
.d-foot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding-block:10px;border-bottom:1px dashed var(--line);align-items:center}
.line-item .ph{aspect-ratio:1}
.qty{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;margin-top:4px}
.qty button{width:22px;height:22px;border:1px solid var(--line)}
.rm{font-size:11px;color:var(--ink-soft);text-decoration:underline}
.btn{display:block;width:100%;text-align:center;padding:12px;border:1px solid var(--ink);letter-spacing:.24em;font-size:12px;transition:background .3s,color .3s}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn[disabled]{opacity:.35;pointer-events:none}
.empty{color:var(--ink-soft);font-size:13px;padding-block:40px;text-align:center}

/* product modal */
.modal{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transition:opacity .5s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);width:min(880px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr}
@media (max-width:700px){.sheet{grid-template-columns:1fr}}
.gallery{display:grid;gap:6px;align-content:start}
.gallery .ph{aspect-ratio:1}
.thumbs{display:flex;gap:6px;padding:0 6px 6px}
.thumbs button{width:52px;aspect-ratio:1;overflow:hidden;opacity:.5}
.thumbs button[aria-current="true"]{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.detail{padding:28px;display:grid;gap:14px;align-content:start;min-width:0}
.detail h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.08em}
.detail .desc{color:var(--ink-soft);font-size:13px;white-space:pre-line}
.specs{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);display:grid;gap:2px;letter-spacing:.06em}
.close{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);justify-self:end}

/* checkout form */
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:12px;color:var(--ink-soft)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px 10px;border-radius:0;width:100%}
textarea{min-height:60px;resize:vertical}
@media (max-width:640px){input,select,textarea{font-size:16px}}
.pay-opt{display:grid;gap:6px}
.pay-opt label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}
.pay-opt input{width:auto}
.note{font-size:12px;color:var(--ink-soft);background:var(--bg);padding:12px;white-space:pre-line;font-family:var(--f-mono);line-height:1.6;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:12px;padding:8px 16px;letter-spacing:.1em;z-index:30;opacity:0;transition:opacity .4s;pointer-events:none}
.toast.on{opacity:1}
</style>

/* ======================== 設定完 ======================== */

const $ = s => document.querySelector(s);
const money = n => `${SHOP.currency} ${n.toLocaleString("en-HK")}`;
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let cart = store.get("soso-cart", {});
const byId = id => SHOP.products.find(p=>p.id===id);

/* placeholder art: soft fog orbs, hue seeded from the code */
function art(p){
  let h=0; for(const c of p.code) h=(h*31+c.charCodeAt(0))%360;
  const dream = p.collection==="dreamcore";
  const base = dream ? (190 + h%80) : (250 + h%40);
  const s = dream ? 30 : 10;
  return `<div class="art" style="background:
    radial-gradient(60% 45% at ${30+h%40}% ${35+h%30}%, hsla(${base},${s}%,72%,.55), transparent 70%),
    radial-gradient(50% 40% at ${70-h%30}% ${70-h%20}%, hsla(${base+40},${s}%,60%,.35), transparent 70%),
    linear-gradient(160deg, var(--bg-2), var(--bg))"><i>${p.code}</i></div>`;
}
const pic = (p,i=0) => p.images && p.images[i] ? `<img src="${p.images[i]}" alt="${p.name}" loading="lazy">` : art(p);

function badge(p){
  if(p.stock<=0) return `<span class="badge">售完 SOLD</span>`;
  if(p.stock<=2) return `<span class="badge">僅餘 ${p.stock} 件</span>`;
  return "";
}

/* render collections */
const filters = {};
function renderCollections(){
  $("#collections").innerHTML = SHOP.collections.map(c=>{
    const f = filters[c.id]||"all";
    const items = SHOP.products.filter(p=>p.collection===c.id && (f==="all"||p.type===f));
    return `<section class="col" id="${c.id}">
      <div class="col-head"><h2>${c.title}<small>${c.en}</small></h2><p>${c.intro}</p></div>
      <div class="chips" role="group" aria-label="${c.title} 篩選">
        <button class="chip" data-col="${c.id}" data-type="all" aria-pressed="${f==="all"}">全部</button>
        ${Object.entries(c.types).map(([k,v])=>`<button class="chip" data-col="${c.id}" data-type="${k}" aria-pressed="${f===k}">${v}</button>`).join("")}
      </div>
      <div class="grid">${items.map(p=>`
        <button class="card ${p.stock<=0?"sold":""}" data-open="${p.id}">
          <div class="ph">${pic(p)}${badge(p)}</div>
          <div class="info"><span class="code">${p.code}</span><span class="name">${p.name}</span><span class="name-en">${p.en}</span><span class="price">${money(p.price)}</span></div>
        </button>`).join("") || `<p class="empty">暫時沒有作品</p>`}</div>
    </section>`;
  }).join("");
}

/* product modal */
function openProduct(id, img=0){
  const p = byId(id); if(!p) return;
  const inCart = cart[id]||0;
  const canAdd = p.stock>0 && inCart<p.stock;
  $("#sheet").innerHTML = `
    <div class="gallery">
      <div class="ph">${pic(p,img)}${badge(p)}</div>
      ${p.images.length>1?`<div class="thumbs">${p.images.map((s,i)=>`<button data-thumb="${i}" data-pid="${p.id}" aria-current="${i===img}" aria-label="相片 ${i+1}"><img src="${s}" alt=""></button>`).join("")}</div>`:""}
    </div>
    <div class="detail">
      <button class="close" data-close>CLOSE ✕</button>
      <span class="code">${p.code}</span>
      <h3 id="mTitle">${p.name}</h3>
      <span class="name-en">${p.en}</span>
      <span class="price" style="font-size:15px">${money(p.price)}</span>
      <p class="desc">${p.desc}</p>
      <div class="specs"><span>物料 · ${p.material||"—"}</span><span>尺寸 · ${p.size||"—"}</span><span>庫存 · ${p.stock>0?p.stock+" 件":"售完"}</span></div>
      <button class="btn" data-add="${p.id}" ${canAdd?"":"disabled"}>${p.stock<=0?"已售完":canAdd?"加入購物袋":"已達庫存上限"}</button>
    </div>`;
  show("#modal");
}

/* cart */
function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function subtotal(){return Object.entries(cart).reduce((s,[id,q])=>s+(byId(id)?.price||0)*q,0)}
function saveCart(){
  for(const id in cart){ const p=byId(id); if(!p||cart[id]<=0) delete cart[id]; else if(cart[id]>p.stock) cart[id]=p.stock; }
  store.set("soso-cart",cart); $("#cartCount").textContent=cartCount();
}
function renderCart(){
  $("#drawerTitle").textContent="購物袋";
  const ids = Object.keys(cart);
  $("#drawerBody").innerHTML = ids.length ? ids.map(id=>{const p=byId(id);return `
    <div class="line-item">
      <div class="ph">${pic(p)}</div>
      <div style="min-width:0"><div class="name">${p.name}</div><span class="code">${p.code}</span>
        <div class="qty"><button data-dec="${id}" aria-label="減少">−</button>${cart[id]}<button data-inc="${id}" aria-label="增加" ${cart[id]>=p.stock?"disabled":""}>+</button></div></div>
      <div style="text-align:right"><div class="price">${money(p.price*cart[id])}</div><button class="rm" data-rm="${id}">移除</button></div>
    </div>`}).join("") : `<p class="empty">購物袋是空的<br>去看看有沒有喜歡的東西吧</p>`;
  $("#drawerFoot").innerHTML = `<div class="row"><span>小計 SUBTOTAL</span><span>${money(subtotal())}</span></div>
    <button class="btn" id="toCheckout" ${ids.length?"":"disabled"}>結帳 CHECKOUT</button>`;
}
function renderCheckout(){
  $("#drawerTitle").textContent="結帳";
  $("#drawerBody").innerHTML = `
  <form id="coForm" novalidate>
    <label for="coName">姓名 *<input id="coName" required autocomplete="name"></label>
    <div style="display:grid;gap:4px"><span style="font-size:12px;color:var(--ink-soft)">電話號碼 *</span>
      <div style="display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:6px">
        <select id="coCode" aria-label="地區區號">${SHOP.phoneCodes.map(([c,n])=>`<option value="${c}">${n} ${c}</option>`).join("")}</select>
        <input id="coPhone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="電話號碼" aria-label="電話號碼" required>
      </div></div>
    <label for="coShip">取貨方式
      <select id="coShip">${SHOP.shipping.map(s=>`<option value="${s.id}">${s.label}${s.fee?` (+${money(s.fee)})`:""}</option>`).join("")}</select></label>
    <label for="coAddr">郵寄地址 *<textarea id="coAddr" required placeholder="國家 / 地區、城市、街道、大廈、樓層及單位"></textarea></label>
    <div><div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px">付款方式</div>
      <div class="pay-opt">${SHOP.payments.map((p,i)=>`<label><input type="radio" name="pay" value="${p.id}" id="pay-${p.id}" ${i===0?"checked":""}>${p.label}</label>`).join("")}</div></div>
    <label for="coNote">備註<textarea id="coNote"></textarea></label>
    <p id="coErr" style="color:var(--accent);font-size:12px;margin:0" hidden></p>
  </form>`;
  const foot = () => { const s=SHOP.shipping.find(x=>x.id===$("#coShip").value);
    $("#drawerFoot").innerHTML = `<div class="row"><span>小計</span><span>${money(subtotal())}</span></div>
    <div class="row"><span>運費</span><span>${money(s.fee)}</span></div>
    <div class="row" style="color:var(--ink)"><span>總數 TOTAL</span><span>${money(subtotal()+s.fee)}</span></div>
    <button class="btn" type="submit" form="coForm">確認訂單</button>
    <button class="rm" id="backCart">← 返回購物袋</button>`; };
  foot(); $("#coShip").addEventListener("change",foot);
}
function placeOrder(e){
  e.preventDefault();
  const name=$("#coName").value.trim(), digits=$("#coPhone").value.replace(/[\s-]/g,""), addr=$("#coAddr").value.trim();
  const err = !name ? "請填寫姓名。" : !/^\d{6,15}$/.test(digits) ? "請填寫正確的電話號碼（只限數字）。" : !addr ? "請填寫郵寄地址。" : "";
  if(err){ $("#coErr").textContent=err; $("#coErr").hidden=false; return; }
  const contact = `${$("#coCode").value} ${digits}`;
  const ship=SHOP.shipping.find(x=>x.id===$("#coShip").value);
  const pay=SHOP.payments.find(p=>p.id===document.querySelector('input[name="pay"]:checked').value);
  const no = "SO" + Date.now().toString().slice(-6);
  const lines = Object.entries(cart).map(([id,q])=>{const p=byId(id);return `${p.code} ${p.name} × ${q}  ${money(p.price*q)}`});
  const total = subtotal()+ship.fee;
  const text = [`訂單 ${no}`, ...lines, `運費 ${money(ship.fee)}（${ship.label}）`, `總數 ${money(total)}`, ``,
    `姓名：${name}`, `電話：${contact}`, `地址：${addr}`, `付款：${pay.label}`, $("#coNote").value.trim()?`備註：${$("#coNote").value.trim()}`:""].filter(Boolean).join("\n");
  $("#drawerTitle").textContent="訂單已建立";
  $("#drawerBody").innerHTML = `
    <div style="display:grid;gap:14px">
      <p style="margin:0;font-size:13px">請以 <b style="font-weight:500">${pay.label}</b> 付款 <b style="font-weight:500">${money(total)}</b></p>
      <div class="note">${pay.details}</div>
      <p style="margin:0;font-size:12px;color:var(--ink-soft)">${SHOP.orderNote}</p>
      <div style="font-size:12px;color:var(--ink-soft)">訂單內容</div>
      <div class="note" id="orderText">${text}</div>
      <div class="note">IG：@${SHOP.instagram}</div>
    </div>`;
  $("#drawerFoot").innerHTML = (pay.paypalMe ? `<a class="btn" href="https://paypal.me/${pay.paypalMe}/${total}HKD" target="_blank" rel="noopener">前往 PayPal 付款 ${money(total)}</a>` : "") + `<button class="btn" id="copyOrder">複製訂單內容</button>
    <a class="btn" href="https://instagram.com/${SHOP.instagram}" target="_blank" rel="noopener">前往 IG 傳送</a>`;
  window._orderText = text;
  cart = {}; saveCart();
}

/* open / close */
function show(sel){ $(sel).classList.add("on"); $(sel).setAttribute("aria-hidden","false"); $("#veil").classList.add("on"); }
function hideAll(){ ["#cart","#modal"].forEach(s=>{$(s).classList.remove("on");$(s).setAttribute("aria-hidden","true")}); $("#veil").classList.remove("on"); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button,a,.veil,.modal"); if(!t) return;
  if(t.id==="veil" || t.matches("[data-close]") || (t.id==="modal" && e.target===t)) return hideAll();
  if(t.dataset.col){ filters[t.dataset.col]=t.dataset.type; renderCollections(); return; }
  if(t.dataset.open) return openProduct(t.dataset.open);
  if(t.dataset.thumb) return openProduct(t.dataset.pid, +t.dataset.thumb);
  if(t.dataset.add){ cart[t.dataset.add]=(cart[t.dataset.add]||0)+1; saveCart(); hideAll(); renderCart(); show("#cart"); return; }
  if(t.dataset.inc){ cart[t.dataset.inc]++; saveCart(); renderCart(); return; }
  if(t.dataset.dec){ cart[t.dataset.dec]--; saveCart(); renderCart(); return; }
  if(t.dataset.rm){ delete cart[t.dataset.rm]; saveCart(); renderCart(); return; }
  if(t.id==="openCart"){ renderCart(); show("#cart"); return; }
  if(t.id==="toCheckout") return renderCheckout();
  if(t.id==="backCart") return renderCart();
  if(t.id==="copyOrder"){
    const txt=window._orderText||"";
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("已複製訂單內容")).catch(()=>{
      const r=document.createRange(); r.selectNodeContents($("#orderText")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("請長按複製已選取的文字");
    });
  }
});
document.addEventListener("submit", e=>{ if(e.target.id==="coForm") placeOrder(e); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideAll(); });

/* boot */
$("#shopName").textContent = SHOP.name;
$("#heroMeta").textContent = SHOP.heroMeta;
$("#heroLine").innerHTML = SHOP.heroLine;
$("#heroSub").textContent = SHOP.heroSub;
$("#aboutText").innerHTML = SHOP.about.map(p=>`<p>${p}</p>`).join("") + `<p>IG <a href="https://www.instagram.com/${SHOP.instagram}/" target="_blank" rel="noopener" style="color:var(--ink);text-underline-offset:3px">@${SHOP.instagram}</a></p>`;
$("#copy").textContent = `© ${new Date().getFullYear()} ${SHOP.name} · 手作 · 全部作品數量有限`;
$("#footPays").innerHTML = SHOP.payments.map(p=>`<span>${p.label}</span>`).join("");
renderCollections(); saveCart();
</script>
